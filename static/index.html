<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApartMint · Find your next home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css?v=5" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🌿</text></svg>">
  </head>
  <body>
    <div id="app">
      <aside class="chat">
        <header class="chat__header">
          <div class="brand">
            <div class="logo">🍃</div>
            <div class="titles">
              <h1>ApartMint</h1>
              <p>Smart apartment chat</p>
            </div>
          </div>
          <div class="mode-toggle" data-active-mode="broker">
            <button class="mode-btn mode-btn--active" data-mode="broker" id="broker-mode-btn">
              <span class="mode-icon">🔍</span>
              <span class="mode-label">Broker</span>
            </button>
            <button class="mode-btn" data-mode="advisor" id="advisor-mode-btn">
              <span class="mode-icon">🎓</span>
              <span class="mode-label">Advisor</span>
            </button>
          </div>
        </header>
        <main class="chat__messages" id="messages"></main>
        <footer class="chat__input">
          <form id="chat-form">
            <input
              id="message-input"
              type="text"
              placeholder="Tell me your location and preferences… e.g. 'Uppsala 2 rooms under 9000 kr'"
              autocomplete="off"
              required
            />
            <button type="submit" class="btn">Send</button>
          </form>
          <div class="hints">
            Try: "In Uppsala, 1-2 rooms under 9000 kr near Luthagen"
          </div>
        </footer>
      </aside>
      <section class="results">
        <header class="results__header">
          <h2>Recommendations</h2>
          <div id="summary" class="summary">Tell me what you're looking for to see listings.</div>
        </header>
        <div id="cards" class="cards"></div>
      </section>
    </div>

    <script src="/static/app.js?v=5" defer></script>
  </body>
</html>
